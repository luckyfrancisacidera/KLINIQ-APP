<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#177349" />
  <title>KLINIQ is offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9f8;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,560px);border:1px solid #e5e7eb;border-radius:20px;background:#fff;padding:32px;box-shadow:0 10px 30px rgba(17,24,39,.06);text-align:center}.logo{width:64px;height:64px;object-fit:contain}.eyebrow{margin:18px 0 0;color:#177349;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0 0;font-size:30px;line-height:1.2}p{margin:14px auto 0;max-width:440px;color:#4b5563;line-height:1.65}.note{margin-top:20px;padding:14px;border-radius:12px;background:#f0faf4;color:#0c3d28;font-size:14px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:24px;border-radius:10px;background:#177349;color:#fff;padding:0 20px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/icon-192.png" alt="KLINIQ" />
    <p class="eyebrow">Connection unavailable</p>
    <h1>KLINIQ is offline</h1>
    <p>The public app shell may remain available, but live clinic availability, sign-in, and appointment booking require an internet connection.</p>
    <div class="note">No appointment has been submitted or queued. Reconnect, review the slot again, and confirm it while online.</div>
    <a class="button" href="/clinics">Try again</a>
  </main>
</body>
</html>
